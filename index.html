<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Toothbrush Clinic - P0 Spike</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        max-width: 100%;
        background-color: #f0f0f0;
        font-family: sans-serif;
        overflow-x: clip;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        touch-action: manipulation;
      }

      #app {
        position: relative;
        width: 100%;
        min-width: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #f0f0f0;
      }

      #ui-layer {
        position: relative;
        z-index: 10;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        pointer-events: none;
      }

      #mouth-view-container {
        position: fixed;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        touch-action: pan-y;
      }

      .ui-screen {
        box-sizing: border-box;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding:
          max(20px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }

      .ui-screen--settings {
        justify-content: flex-start;
      }

      button {
        display: block;
        margin-bottom: 5px;
        width: 100%;
        text-align: left;
        padding: 5px;
        min-height: 44px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
